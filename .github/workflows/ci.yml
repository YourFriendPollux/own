# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af685 # v4.2.2 pinned by SHA
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo deny check
      - run: cargo vet --locked
      - name: Fuzz smoke (1 min per target)
        run: |
          rustup toolchain install nightly --profile minimal
          cd fuzz
          cargo +nightly fuzz run extract_tarball -- -max_total_time=60
          cargo +nightly fuzz run packument -- -max_total_time=20
          cargo +nightly fuzz run spdx_expr -- -max_total_time=20
          cargo +nightly fuzz run osv_json -- -max_total_time=20
      - name: Determinism check (INV-10)
        run: |
          cd /tmp && rm -rf own-det && mkdir own-det && cd own-det
          git init -q .
          printf '{"name":"det","version":"0.0.0","private":true}\n' > package.json
          cargo install --path /home/runner/work/own/own --root /tmp/ownbin --locked >/dev/null 2>&1 || true
          OWN=$GITHUB_WORKSPACE/target/debug/own
          cargo build --workspace >/dev/null
          $OWN init >/dev/null
          OWN_NOW=2026-11-10T00:00:00Z $OWN verify >/dev/null
          sha256sum own.lock > run1.sha
          OWN_NOW=2026-11-10T00:00:00Z $OWN verify >/dev/null
          sha256sum own.lock > run2.sha
          diff run1.sha run2.sha
