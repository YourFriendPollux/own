# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned by SHA
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 pinned by SHA
        with:
          toolchain: "1.99.1"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install cargo-deny and cargo-vet
        run: |
          cargo install cargo-deny --locked --quiet
          cargo install cargo-vet --locked --quiet
      - run: cargo deny check
      - run: cargo vet --locked
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --quiet
      - name: Fuzz smoke (1 min per target)
        run: |
          rustup toolchain install nightly --profile minimal
          cd fuzz
          cargo +nightly fuzz run extract_tarball -- -max_total_time=60
          cargo +nightly fuzz run packument -- -max_total_time=20
          cargo +nightly fuzz run spdx_expr -- -max_total_time=20
          cargo +nightly fuzz run osv_json -- -max_total_time=20
      - name: Determinism check (INV-10, non-empty offline fixture)
        run: cargo test --locked -p own-cli --test ci_guards inv10_nonempty_vendor_verify_and_sbom_are_byte_reproducible -- --exact
