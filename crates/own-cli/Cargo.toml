[package]
name = "own-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binary `own`"

[[bin]]
name = "own"
path = "src/main.rs"

[dependencies]
own-core = { path = "../own-core" }
own-net = { path = "../own-net" }
own-extract = { path = "../own-extract" }
own-policy = { path = "../own-policy" }
own-slice = { path = "../own-slice" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v5"] }
sha2 = { workspace = true }
libc = "0.2"
