[package]
name = "own-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lock, manifests, hashing, JCS, canonical TOML writer, verification (no network, no SPDX/OSV)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2 = { workspace = true }
toml = { workspace = true }
rayon = "1"
walkdir = "2"
ryu = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
