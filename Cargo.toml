[workspace]
resolver = "2"
exclude = ["fuzz"] # cargo-fuzz has its own workspace
members = [
    "crates/own-core",
    "crates/own-policy",
    "crates/own-net",
    "crates/own-extract",
    "crates/own-cli",
    "crates/own-verify",
    "crates/own-slice",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/YourFriendPollux/own"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # was: serde_json = "1"
sha2 = "0.10"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
